# ============================================================================
#  FAST-LIVO2 算法配置 —— 指向 AirSim 仿真桥(/twin/*)，用实机标定
#  放: ~/twin_ws/src/FAST-LIVO2/config/TwinSim.yaml
#  配套相机配置: TwinSim_camera.yaml (见下方注释) —— 必须 rosparam load 到 /laserMapping
#  用法: rosparam load TwinSim.yaml
#        rosparam load TwinSim_camera.yaml /laserMapping
#        rosrun fast_livo fastlivo_mapping __name:=laserMapping
#
#  关键取舍:
#   - 仿真桥点云是纯 XYZ(已补零 rgb) → 只能走 lidar_type: 4 (L515 路径，不需逐点时间)
#   - 实机配置是 lidar_type: 1 (Livox Avia) → 需要逐点时间(CustomMsg)，仿真喂不了
#   - 外参/IMU 噪声用实机值；lidar_type 因仿真适配而不同
# ============================================================================
common:
  img_topic: "/twin/camera/color/image_raw"
  lid_topic: "/twin/lidar/points_preview"
  imu_topic: "/twin/imu/data_raw"
  img_en: 0            # 仿真先关视觉；开成 1 需相机配置与时间同步靠谱
  lidar_en: 1
  ros_driver_bug_fix: false

# 实机标定值（MID360 → IMU / 相机 → 雷达）—— 从实机 FAST-LIVO2/config/MID360*.yaml 抄
extrin_calib:
  extrinsic_T: [-0.011, -0.02329, 0.04412]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  Rcl: [-0.000601, -0.999899, 0.014194,
        -0.006397, -0.014190, -0.999879,
         0.999979, -0.000691, -0.006388]
  Pcl: [0.011720, -0.078665, -0.048631]

time_offset:
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 4        # L515 路径：读 sensor_msgs/PointCloud2 (需 rgb 字段!)；AVIA=1 需 CustomMsg
  scan_line: 4
  blind: 0.3

vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 100
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: false
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5
  gyr_cov: 0.3
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: true

publish:
  dense_map_en: true
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "twin_sim"
  pose_output_en: false

pcd_save:
  pcd_save_en: false
  colmap_output_en: false
  filter_size_pcd: 0.15
  interval: -1

# ----------------------------------------------------------------------------
# TwinSim_camera.yaml （单独文件，load 到 /laserMapping 节点）
# ⚠️ cam_model 必需 —— 缺了会崩 "Camera model not correctly specified"
#    刷屏 "Cannot find value for parameter: laserMapping/cam_model"
# 值用实机 camera_self.yaml（D435/自研相机）：
#
# cam_model: Pinhole
# cam_width: 800
# cam_height: 600
# scale: 1.0
# cam_fx: 893.68
# cam_fy: 892.146
# cam_cx: 382.965
# cam_cy: 301.193
# cam_d0: 0.072654
# cam_d1: -0.091823
# cam_d2: 0.001453
# cam_d3: -0.002248
# ----------------------------------------------------------------------------
